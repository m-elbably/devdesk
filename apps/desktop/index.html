<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Relative: the packaged app is served from file://, where /icon.png would miss. -->
    <link rel="icon" href="./icon.png" />
    <title>DevDesk</title>
    <script>
      // Preset the dark class before first paint (Nuxt UI color mode reads the
      // same storage key) so dark-mode users get no light flash.
      ;(function () {
        var v = localStorage.getItem('vueuse-color-scheme')
        var dark = v ? v === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches
        if (dark) document.documentElement.classList.add('dark')
      })()
    </script>
    <style>
      /* Switching workspaces reloads the window, so the spinner has to live outside
         Vue to survive the reload. Plain colors: Nuxt UI's vars aren't loaded yet. */
      #switch-overlay {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        gap: 1.25rem;
        background: #fff;
      }
      .dark #switch-overlay {
        background: #0a0a0a;
      }
      #switch-overlay img {
        width: 4rem;
        height: 4rem;
        animation: switch-breathe 1.4s ease-in-out infinite;
      }
      /* Three dots ripple out under the icon, one after the other. */
      #switch-overlay span {
        width: 0.5rem;
        height: 0.5rem;
        border-radius: 50%;
        background: #00c16a;
        animation: switch-bounce 1s ease-in-out infinite;
      }
      #switch-overlay span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #switch-overlay span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes switch-breathe {
        50% {
          transform: scale(1.12);
        }
      }
      @keyframes switch-bounce {
        50% {
          transform: translateY(-0.4rem);
          opacity: 0.4;
        }
      }
    </style>
  </head>
  <body>
    <div id="app" class="isolate"></div>
    <div id="switch-overlay" hidden>
      <img src="./icon.png" alt="" />
      <div style="display: flex; gap: 0.375rem"><span></span><span></span><span></span></div>
    </div>
    <script>
      // Unhide before first paint when the reload came from a workspace switch.
      if (sessionStorage.getItem('devdesk.switching')) document.getElementById('switch-overlay').hidden = false
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
